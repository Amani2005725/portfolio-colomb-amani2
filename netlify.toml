[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These VITE_* values are intentionally bundled into the client-side code
  # (the Supabase anon key is a public key protected by Row Level Security).
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_CONTACT_EMAIL"
